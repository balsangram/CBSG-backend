name: Deploy CBSG Backend

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e

            echo "Starting CBSG backend deployment..."

            cd /home/ubuntu/CBSG-backend

            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "Setting permissions..."
            sudo chown -R ubuntu:ubuntu /home/ubuntu/CBSG-backend

            echo "Installing dependencies..."
            npm ci --omit=dev

            echo "Restarting backend..."

            if pm2 describe cbsg-backend > /dev/null 2>&1; then
              pm2 restart cbsg-backend --update-env
            else
              pm2 start src/server.js --name cbsg-backend
            fi

            pm2 save

            echo "Checking backend..."
            sleep 5
            curl -f http://localhost:7080

            echo "CBSG deployment completed successfully!"